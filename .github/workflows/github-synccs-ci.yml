name: SyncCS GitHub Backend CI

on:
  push:
    branches:
      - synccs-github-replacement
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Compile SyncCS without publishing artifacts
        run: |
          chmod +x gradlew
          ./gradlew :SyncCS:make --no-daemon --stacktrace
