name: SyncCS GitHub Safety Build

on:
  pull_request:
    paths:
      - 'SyncCS/**'
      - '.github/workflows/synccs-github-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Compile SyncCS
        run: |
          chmod +x ./gradlew
          ./gradlew :SyncCS:testDebugUnitTest :SyncCS:make --no-daemon
