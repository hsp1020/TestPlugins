name: Android UI Emulator Tests

# Separate, opt-in UI workflow. The release build workflow is unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    name: ${{ matrix.device }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { device: phone-portrait,  target: google_apis, width: 1080, height: 2400, density: 420, rotation: 0 }
          - { device: phone-landscape, target: google_apis, width: 1080, height: 2400, density: 420, rotation: 1 }
          - { device: tablet-portrait, target: google_apis, width: 1600, height: 2560, density: 320, rotation: 0 }
          - { device: tablet-landscape,target: google_apis, width: 1600, height: 2560, density: 320, rotation: 1 }
          - { device: android-tv,     target: android-tv, width: 1920, height: 1080, density: 240, rotation: 0 }

    steps:
      - name: Checkout master source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build only StremioC test extension
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :StremioC:make --no-daemon
          mkdir -p ui-test-input ui-test-results
          mapfile -t plugins < <(find StremioC/build -type f -name '*.cs3' | sort)
          if [ "${#plugins[@]}" -ne 1 ]; then
            printf 'Expected exactly one StremioC .cs3; found %s\n' "${#plugins[@]}"
            printf '%s\n' "${plugins[@]}"
            exit 1
          fi
          cp "${plugins[0]}" ui-test-input/StremioC.cs3
          unzip -tq ui-test-input/StremioC.cs3
          sha256sum ui-test-input/StremioC.cs3 > ui-test-results/plugin-sha256.txt

      - name: Download official CloudStream pre-release host
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 300 \
            'https://github.com/recloudstream/cloudstream/releases/download/pre-release/app-prerelease-release.apk' \
            --output ui-test-input/cloudstream.apk
          unzip -tq ui-test-input/cloudstream.apk
          sha256sum ui-test-input/cloudstream.apk > ui-test-results/host-sha256.txt

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and exercise CloudStream UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: ${{ matrix.target }}
          arch: x86_64
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          script: python3 .github/scripts/android_ui_test.py --device '${{ matrix.device }}' --width ${{ matrix.width }} --height ${{ matrix.height }} --density ${{ matrix.density }} --rotation ${{ matrix.rotation }} --apk ui-test-input/cloudstream.apk --plugin ui-test-input/StremioC.cs3 --output ui-test-results

      - name: Upload screenshots, UI trees, transitions and Logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-${{ matrix.device }}
          path: ui-test-results/
          if-no-files-found: warn
          retention-days: 14
