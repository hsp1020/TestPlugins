name: Build

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      # 이 부분이 새로 만든 외부 공개 레포지토리를 가져오도록 수정되었습니다.
      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          repository: "hsp1020/TestPlugins-build" # 새로 만든 공개 배포용 레포 주소
          token: ${{ secrets.BUILD_REPO_TOKEN }}   # 등록해 둔 비밀 토큰 사용
          ref: "main"                             # 공개 레포의 기본 브랜치 (main 또는 master)
          path: "builds"
      
      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson --no-daemon 
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds/ || true
          cp **/build/*.jar $GITHUB_WORKSPACE/builds || true
          cp build/plugins.json $GITHUB_WORKSPACE/builds || true

      # 새로 만든 외부 공개 레포의 main 브랜치로 빌드 결과물을 밀어 넣습니다.
      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Build $GITHUB_SHA"
            git push origin main --force # 외부 공개 레포의 main 브랜치로 강제 push
          fi
