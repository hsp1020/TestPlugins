name: Build

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          repository: "hsp1020/TestPlugins-build" # 새로 만든 공개 배포용 레포 주소
          token: ${{ secrets.BUILD_REPO_TOKEN }}   # 등록해 둔 비밀 토큰 사용
          ref: "builds"                           # 공개 레포의 'builds' 브랜치를 체크아웃
          path: "builds"
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare plugin versions
        run: python3 "$GITHUB_WORKSPACE/src/.github/scripts/publish_plugins.py" prepare "$GITHUB_WORKSPACE/src" "$GITHUB_WORKSPACE/builds"

      - name: Build Plugins
        env:
          GITHUB_REPOSITORY: "hsp1020/TestPlugins-build"
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x gradlew
          ./gradlew make makePluginsJson --no-daemon
          python3 .github/scripts/publish_plugins.py publish "$GITHUB_WORKSPACE/src" "$GITHUB_WORKSPACE/builds"
          cp **/build/*.jar "$GITHUB_WORKSPACE/builds/" || true
          cp repo.json "$GITHUB_WORKSPACE/builds/"

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Build $GITHUB_SHA"
            git push origin HEAD:builds
          fi
