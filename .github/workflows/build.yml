name: Build

concurrency: 
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          repository: "hsp1020/TestPlugins-build" # 새로 만든 공개 배포용 레포 주소
          token: ${{ secrets.BUILD_REPO_TOKEN }}   # 등록해 둔 비밀 토큰 사용
          ref: "builds"                           # 공개 레포의 'builds' 브랜치를 체크아웃
          path: "builds"
      
      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        env:
          GITHUB_REPOSITORY: "hsp1020/TestPlugins-build" # 빌드 도구가 공개 레포용 주소를 자동 생성하도록 환경변수 강제 주입
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson --no-daemon 
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds/ || true
          cp **/build/*.jar $GITHUB_WORKSPACE/builds || true
          cp build/plugins.json $GITHUB_WORKSPACE/builds || true
          cp repo.json $GITHUB_WORKSPACE/builds/ || true

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Build $GITHUB_SHA"
            git push origin builds --force # 공개 레포의 'builds' 브랜치로 강제 push
          fi
